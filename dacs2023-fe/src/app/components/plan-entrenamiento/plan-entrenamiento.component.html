<body>
  <div class="container">
    <h1>Rutina</h1>

    <div class="day-card" *ngIf="routine">
      <h2 class="day-title">{{ getDayName(routine.day) }}</h2>
      <p class="muscle-groups">{{ routine.routineName }}</p>

      <div class="exercise-list">
        <div *ngFor="let exercise of exercises" class="exercise-card">
          <div class="exercise-image-container">
            <img
              *ngIf="exercise.image"
              [src]="exercise.image"
              [alt]="'Demostración de ' + exercise.name"
              class="exercise-image"
            />
            <div
              *ngIf="!exercise.image"
              class="exercise-image-placeholder"
            >
              Sin imagen disponible
            </div>
          </div>
          <h3 class="exercise-name">{{ exercise.name }}</h3>
          <p class="exercise-description">{{ exercise.description }}</p>
          <div class="exercise-info">
            <div class="info-item">
              <p class="info-label">Series</p>
              <p class="info-value">{{ exercise.sets }}</p>
            </div>
            <div class="info-item">
              <p class="info-label">Repeticiones</p>
              <p class="info-value">{{ exercise.reps }}</p>
            </div>
          </div>
        </div>
      </div>
      <div class="botones-usuario">
        <button (click)="editRoutine()" class="btn-edit">Editar rutina</button>
        <button (click)="deleteRoutine()" class="btn-delete">Eliminar rutina</button>
        <button (click)="goBack()" class="btn-back">Atrás</button>
      </div>
    </div>

    <div *ngIf="!routine" class="error-message">
      No se encontró la rutina solicitada
    </div>
  </div>
</body>
<footer class="footer">
  <p>© 2024 MuscleHub. Todos los derechos reservados.</p>
</footer>
