    enabled: false
    basic:
      enabled: false


logging:
 level:
  root: info
  feign: debug
  utn.dacs.ms.conector.api.client: debug
  org.springframework.cloud.openfeign: debug
management:
  security:
    enabled: false
  endpoints:
    enabled-by-default: false
    web:
      base-path: /metrics
      exposure:
        include: "health,info"
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
feign:
